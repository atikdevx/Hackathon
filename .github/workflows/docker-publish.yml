# Runs the offline test suite, then builds and publishes the Docker fallback image to GHCR:
#   ghcr.io/<owner>/gridwise-llm:1.0.0, :latest and :sha-<commit>
# Uses the built-in GITHUB_TOKEN (no personal credentials). No secrets are baked into the image.
name: test-and-publish-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_VERSION: "1.0.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/gridwise-llm" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.IMAGE_VERSION }}
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Smoke-test the published image
        run: |
          docker run -d --name gw -p 8000:8000 ${{ steps.image.outputs.name }}:${{ env.IMAGE_VERSION }}
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs gw; exit 1
