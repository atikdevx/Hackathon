# Render Blueprint: builds the Dockerfile and runs one always-on web service.
# Set LLM_API_KEY as a secret in the Render dashboard (sync: false keeps it out of git).
services:
  - type: web
    name: gridwise-llm
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-5
      - key: LLM_EFFORT
        value: low
      - key: LLM_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "2"
